[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "callscope-worker"
version = "0.1.0"
description = "Isolated trusted CallScope AI audio transcription worker"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
speech = ["faster-whisper>=1.1,<2.0", "av>=11,<19"]
dev = ["pytest>=8.4,<10.0"]

[project.scripts]
callscope-transcribe = "callscope_worker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["callscope_worker"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
